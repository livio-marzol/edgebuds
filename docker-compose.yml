version: "3.9"

services:
  edgebuds-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgebuds-backend
    ports:
      - "8000:8000"
    environment:
      - PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./backend/static/gradcam:/app/backend/static/gradcam
    restart: unless-stopped
